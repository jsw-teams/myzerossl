upstream ssl_signer_mtls_backend {
    server 127.0.0.1:19443;
    keepalive 8;
}

server {
    listen 9443 ssl;
    http2 on;
    server_name gateway.js.gripe;

    ssl_certificate     /etc/openresty/ssl/js.gripe.fullchain.pem;
    ssl_certificate_key /etc/openresty/ssl/js.gripe.key.pem;

    ssl_client_certificate /etc/myzerossl/keyless/edge-client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    charset utf-8;
    server_tokens off;

    location = /api/v1/ssl-signer {
        return 308 /api/v1/ssl-signer/v1/public-key;
    }

    location ^~ /api/v1/ssl-signer/ {
        client_max_body_size 128k;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Keyless-Token $http_x_keyless_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://ssl_signer_mtls_backend/;
    }

    location / {
        return 404;
    }
}
